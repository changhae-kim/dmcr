e0: 8979.0
pre_edge: -20.0
post_edge: +100.0

# Initial guesses for concentrations and spectra.
# The guess concentrations were generated using an ad hoc script.
# The guess spectra are representative spectra in the dataset.
model:
  C_guess: mix_cu_c_guess.npy
  ST_guess:
    - flat_2_0.dat
    - flat_2_33.dat
    - flat_2_63.dat

# Smooth concentrations across neighboring timesteps, except at
# the declared break which separates the two experimental series.
temporal_smoothness:
  weight: 1.0E-3
  i_breaks: [63]

# Regularize spectral shapes by penalizing roughness.
# One weight per species.
spectral_smoothness:
  weights: [0.01, 0.01, 0.01]
