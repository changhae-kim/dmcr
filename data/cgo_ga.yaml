e0: 10367.2
pre_edge: -20.0
post_edge: +100.0

# Initial guesses for concentrations and spectra.
# The guess concentrations were generated using an ad hoc script.
# The guess spectra are representative spectra in the dataset.
# The repeated "flat_1_9.dat" entry is intentional.
model:
  C_guess: cgo_ga_c_guess.npy
  ST_guess:
    - flat_1_9.dat
    - flat_1_9.dat
    - flat_1_22.dat
    - flat_1_63.dat

# Fix the bulk species concentration.
anchor:
  weight: 1.0
  i_species: 0
  C0: 0.7

# Smooth concentrations across neighboring timesteps, except at
# the declared break which separates the two experimental series.
temporal_smoothness:
  weight: 1.0E-3
  i_breaks: [62]

# Regularize spectral shapes by penalizing roughness.
# One weight per species.
spectral_smoothness:
  weights: [0.31, 0.10, 0.01, 0.01]

# Encourage the ordering of concentration changes to follow the Cu
# K-edge deconvolution result. The reference is `cgo_cu_c_opt.npy`,
# which can be generated by running `cgo_cu.yaml`. For convenience,
# a precomputed copy is distributed with the repository.
kendall_rank:
  weight: 1.0E-3
  C_ref: cgo_cu_c_opt.npy
